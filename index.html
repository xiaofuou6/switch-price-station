<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NS史低情报站 · Switch 价格追踪与推荐工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='6' width='20' height='12' rx='4' fill='%230E1524'/%3E%3Crect x='2' y='6' width='20' height='12' rx='4' fill='none' stroke='%232ED47D' stroke-width='2'/%3E%3Ccircle cx='9' cy='12' r='2.6' fill='%23F5A623'/%3E%3Ccircle cx='15' cy='12' r='2.6' fill='%2338BDF8'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  /* 星露谷物语配色：暖农舍 + 牛皮纸 + 木框 */
  --bg:#F2E4BC;        /* 牛皮纸米黄 */
  --panel:#E8D5A3;     /* 木柜色 */
  --panel2:#DFC791;    /* 选中/悬停木色 */
  --card:#FAF0D0;      /* 更浅的纸张 */
  --line:#B89968;      /* 木边框 */
  --line2:#A07E4F;     /* 深木边框 */
  --tx:#4A3728;        /* 深棕主文字 */
  --tx2:#7A6548;       /* 次棕 */
  --tx3:#9C8465;       /* 浅棕 */
  --green:#6FA844;     /* 作物草绿 */
  --amber:#E8A33D;     /* 星之果实金 */
  --red:#D95545;       /* 草莓红 */
  --cyan:#4A90B8;      /* 湖水蓝 */
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
button,input,select,textarea{font-family:inherit}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;line-height:1.55;
background-image:radial-gradient(circle at 20% 10%, rgba(255,255,255,.25) 0, transparent 40%), radial-gradient(circle at 80% 90%, rgba(160,126,79,.12) 0, transparent 40%)}
a{color:var(--cyan);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.app{display:flex;min-height:100vh}
/* ===== 侧边栏 ===== */
.side{width:224px;flex:0 0 224px;background:linear-gradient(180deg,#E8D5A3 0%,#D9BE85 100%);border-right:3px solid var(--line2);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:2px 0 8px rgba(74,55,40,.15)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:3px double var(--line2)}
.brand .logo{width:34px;height:34px;flex:0 0 34px}
.brand h1{font-size:16px;font-weight:800;letter-spacing:1px;color:var(--tx)}
.brand p{font-size:11px;color:var(--tx2);margin-top:2px}
.nav{flex:1;padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;cursor:pointer;color:var(--tx2);font-weight:600;margin-bottom:3px;border:2px solid transparent;transition:all .12s}
.nav-item svg{flex:0 0 18px;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:var(--card);color:var(--green);border-color:var(--line2);box-shadow:inset 0 -3px 0 var(--green);font-weight:700}
.nav-item .count{margin-left:auto;font-size:11px;background:var(--panel2);border:1px solid var(--line2);padding:1px 7px;border-radius:10px;color:var(--tx2)}
.nav-item.active .count{color:var(--green)}
.side-foot{padding:14px 16px;border-top:3px double var(--line2);font-size:11px;color:var(--tx3);line-height:1.7}
.side-foot b{color:var(--tx2)}
/* ===== 主区 ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:3px double var(--line2);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar h2{font-size:17px;font-weight:800;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);background:var(--panel2);border:1px solid var(--line2);padding:4px 10px;border-radius:20px}
.chip.green{color:var(--green);border-color:rgba(46,212,125,.4)}
.chip.amber{color:var(--amber);border-color:rgba(245,166,35,.4)}
.chip.red{color:var(--red);border-color:rgba(240,85,74,.4)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#06251A;font-weight:800}
.btn.primary:hover{filter:brightness(1.1);color:#06251A}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.view{padding:20px;max-width:1280px;width:100%;margin:0 auto}
.section-title{font-size:15px;font-weight:800;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}
.section-title .bar{width:4px;height:16px;background:var(--green);border-radius:2px}
.section-title .more{margin-left:auto;font-size:12px;color:var(--tx2);font-weight:500}
/* ===== 卡片 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat-card .num{font-size:30px;font-weight:900;line-height:1.1;margin-top:6px}
.stat-card .lbl{font-size:12px;color:var(--tx2);font-weight:600}
.stat-card .sub{font-size:11px;color:var(--tx3);margin-top:4px}
.stat-card.g .num{color:var(--green)} .stat-card.a .num{color:var(--amber)} .stat-card.r .num{color:var(--red)} .stat-card.c .num{color:var(--cyan)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.game-card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:12px;transition:transform .12s,border-color .12s,box-shadow .12s;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.game-card:hover{border-color:var(--line2);transform:translateY(-2px)}
.game-card .g-top{display:flex;align-items:flex-start;gap:8px}
.game-card .g-name{font-weight:800;font-size:15px;line-height:1.3}
.game-card .g-en{font-size:11px;color:var(--tx3);margin-top:2px}
.game-card .g-tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);color:var(--tx2)}
.tag.g{color:var(--green);border-color:rgba(46,212,125,.35)}
.tag.a{color:var(--amber);border-color:rgba(245,166,35,.35)}
.tag.r{color:var(--red);border-color:rgba(240,85,74,.35)}
.tag.c{color:var(--cyan);border-color:rgba(56,189,248,.35)}
.game-card .g-prices{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.price-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line2);padding:3px 8px;border-radius:7px;color:var(--tx)}
.price-chip b{font-weight:800}
.price-chip.low{color:var(--green);border-color:rgba(46,212,125,.5);background:rgba(46,212,125,.08)}
.price-chip.wait{color:var(--amber);border-color:rgba(245,166,35,.45)}
.price-chip.tbd{color:var(--tx3);border-style:dashed}
.game-card .g-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:9px}
.game-card .g-cover{height:104px;border-radius:8px;overflow:hidden;background:#0B111D;margin-bottom:2px}
.game-card .g-cover img{width:100%;height:100%;object-fit:cover;display:block}
.game-card .g-cover .no-cover{display:none;width:100%;height:100%;align-items:center;justify-content:center;color:var(--tx3);font-size:12px}
.deal-cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin-bottom:10px;background:#0B111D;display:block}
.hot-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:thin}
.hot-card{flex:0 0 150px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);cursor:pointer;text-decoration:none;color:inherit;transition:border-color .15s}
.hot-card:hover{border-color:var(--green)}
.hot-card .hc-cover{width:100%;aspect-ratio:4/3;border-radius:6px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;text-align:center;padding:6px;line-height:1.25}
.hot-card .hc-name{font-size:13px;font-weight:700;margin-bottom:3px}
.hot-card .hc-note{font-size:11px;color:var(--tx2);line-height:1.4}
.section-title{font-size:15px;font-weight:800;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.section-title .more{font-size:12px;font-weight:400;color:var(--tx2)}
/* ===== 试玩 Demo ===== */
.demo-box{position:relative;border-radius:10px;overflow:hidden;background:#0B111D;margin-bottom:12px}
.demo-box img{display:block;width:100%;max-height:400px;object-fit:cover;object-position:center}
.demo-box .demo-fallback{display:none;align-items:center;justify-content:center;min-height:180px;color:var(--tx3);font-size:13px;gap:8px}
.demo-box .demo-bar{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(8,12,22,.88));padding:26px 14px 10px;font-size:12px;color:var(--tx2)}
.demo-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stars{color:var(--amber);font-size:12px;letter-spacing:1px}
.verdict{font-size:11px;color:var(--tx2);margin-left:auto}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.5px}
.badge.low{background:rgba(46,212,125,.15);color:var(--green);border:1px solid rgba(46,212,125,.4)}
.badge.onsale{background:rgba(56,189,248,.13);color:var(--cyan);border:1px solid rgba(56,189,248,.4)}
.badge.pc{background:rgba(240,85,74,.13);color:var(--red);border:1px solid rgba(240,85,74,.4)}
.badge.wait{background:rgba(245,166,35,.12);color:var(--amber);border:1px solid rgba(245,166,35,.4)}
/* ===== 表格 ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;background:var(--panel);table-layout:fixed;min-width:760px}
table.tbl th{background:var(--panel2);color:var(--tx2);font-size:12px;font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:rgba(46,212,125,.03)}
/* ===== 工具栏 ===== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1;min-width:200px;position:relative}
.toolbar .search input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:9px 12px 9px 34px;color:var(--tx);font-size:13px;outline:none}
.toolbar .search input:focus{border-color:var(--green)}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--tx3);fill:none;stroke-width:2}
select, input[type=text], input[type=number], input[type=date], textarea{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;color:var(--tx);font-size:13px;outline:none;font-family:inherit}
select:focus, input:focus, textarea:focus{border-color:var(--green)}
select option{background:var(--panel2)}
/* ===== 详情 ===== */
.detail-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-bottom:16px}
.detail-head .t1{font-size:24px;font-weight:900;line-height:1.2}
.detail-head .t2{font-size:13px;color:var(--tx2);margin-top:4px}
.detail-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel h3{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .bar{width:4px;height:14px;background:var(--green);border-radius:2px}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv-item{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;min-width:100px}
.kv-item .k{font-size:11px;color:var(--tx3)}
.kv-item .v{font-weight:800;margin-top:2px;font-size:14px}
.alert-box{display:flex;gap:10px;padding:12px 14px;border-radius:var(--radius);border:1px solid;margin-bottom:12px;font-size:13px}
.alert-box.info{background:rgba(56,189,248,.07);border-color:rgba(56,189,248,.3);color:var(--cyan)}
.alert-box.warn{background:rgba(245,166,35,.07);border-color:rgba(245,166,35,.35);color:var(--amber)}
.alert-box.good{background:rgba(46,212,125,.07);border-color:rgba(46,212,125,.35);color:var(--green)}
.alert-box.bad{background:rgba(240,85,74,.07);border-color:rgba(240,85,74,.35);color:var(--red)}
.list-line{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:baseline;font-size:13px}
.list-line:last-child{border-bottom:none}
.list-line .d{color:var(--tx3);font-size:12px;flex:0 0 76px}
.list-line .txt{flex:1}
.list-line .tag-s{flex:0 0 auto}
.chart-box{width:100%;height:320px}
/* ===== 弹窗 / toast ===== */
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:560px;max-height:86vh;overflow-y:auto;padding:20px}
.modal h3{font-size:16px;font-weight:800;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px;font-weight:600}
.form-row .hint{font-size:11px;color:var(--tx3);margin-top:4px}
.form-inline{display:flex;gap:8px;flex-wrap:wrap}
.form-inline .form-row{flex:1;min-width:120px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast-wrap{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--green);border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:tin .2s ease}
.toast.warn{border-left-color:var(--amber)}
.toast.err{border-left-color:var(--red)}
@keyframes tin{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
/* ===== 生成器 ===== */
.gen-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.gen-card .g-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gen-card .g-head h3{font-size:15px;font-weight:800}
.gen-card .g-head .btn{margin-left:auto}
.gen-out{background:#0B111E;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px;white-space:pre-wrap;line-height:1.75;max-height:340px;overflow-y:auto;color:#C9D6EA}
.gen-out .hl{color:var(--green);font-weight:700}
.gen-out .hl2{color:var(--amber);font-weight:700}
/* ===== 评论选题 ===== */
.idea-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:8px}
.idea-item.done{opacity:.55}
.idea-item .txt{flex:1;font-size:13px}
.idea-item .meta{font-size:11px;color:var(--tx3)}
.empty{text-align:center;color:var(--tx3);padding:36px 12px;font-size:13px}
.empty b{display:block;font-size:15px;color:var(--tx2);margin-bottom:6px}
@media (max-width:960px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto}
  .brand{border-bottom:none;padding:10px 14px}
  .brand h1{font-size:14px}.brand p{display:none}
  .nav{display:flex;padding:6px 8px;flex:none}
  .nav-item{white-space:nowrap;padding:10px 12px}
  .side-foot{display:none}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .chart-box{height:260px}
}
@media (max-width:560px){
  .stat-grid{grid-template-columns:1fr 1fr}
  .view{padding:12px}
  .topbar{padding:10px 12px}
  .detail-head .t1{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div style="font-size:26px;line-height:1.1;flex:0 0 auto">🥕</div>
      <div style="flex:1;min-width:0"><h1>NS史低情报站</h1><p>Switch 价格追踪 · 口碑推荐</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="overlay-root"></div>
<div id="toast-wrap"></div>
<script>
"use strict";
/* ============ 常量 ============ */
const REGIONS = [
  {key:'jp',  label:'日区', currency:'JPY', sym:'¥'},
  {key:'hk',  label:'港区', currency:'HKD', sym:'HK$'},
  {key:'us',  label:'美区', currency:'USD', sym:'$'},
  {key:'br',  label:'巴西区', currency:'BRL', sym:'R$'},

  {key:'cart',label:'卡带参考', currency:'CNY', sym:'¥'}
];
const GENRES = ['策略','开放世界','动作RPG','共斗','双人合作','格斗','体育','冒险','肉鸽','体感','种田模拟','银河城','喜剧','射击','横版动作','刷宝'];
const NAV = [
  {id:'deals', label:'每周折扣'},
  {id:'library', label:'游戏库'},
  {id:'dashboard', label:'仪表盘'},
  {id:'watchlist', label:'蹲折扣清单'},
  {id:'reviews', label:'好不好玩'},
  {id:'studio', label:'内容工作台'},
  {id:'settings', label:'设置与数据'}
];
const NAV_ICONS = {
  dashboard:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  library:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="4" rx="1.5"/><rect x="3" y="10" width="18" height="4" rx="1.5"/><rect x="3" y="17" width="18" height="4" rx="1.5"/></svg>',
  watchlist:'<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>',
  deals:'<svg viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>',

function fmtPrice(reg){
  if(!reg) return '<span class="price-chip tbd">待补录</span>';
  if(reg.tbd || reg.cur==null) return '<span class="price-chip tbd">待补录</span>';
  let main = '¥'+reg.cur;
  if(reg.nativeCur != null && reg.currency && reg.currency!=='CNY') main += '（'+reg.nativeCur+reg.currency+'）';
  const cls = reg.isLow?'low':(reg.onSale?'wait':'');
  return '<span class="price-chip'+(cls?' '+cls:'')+'">'+main+'</span>';
}
function toast(msg, type){
  const w=document.createElement('div'); w.className='toast'+(type?' '+type:''); w.textContent=msg;
  $('#toast-wrap').appendChild(w);
  setTimeout(()=>w.remove(), 3600);
}
function copyText(txt){
  const done = ()=>toast('已复制，可直接粘贴到笔记/动态');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, ()=>fallback()); }
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
}
function openModal(html){
  const root=$('#overlay-root');
  root.innerHTML='<div class="overlay" onclick="if(event.target===this)this.remove()"><div class="modal">'+html+'</div></div>';
}

const LS_KEY = 'ns_price_station_v1';
let DB;
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ DB = JSON.parse(raw); if(!DB.games || !DB.meta) throw new Error('bad'); DB.games.forEach(g=>{ if(!g.demo) g.demo=demoFor(g); }); }
    else{ DB = seed(); saveDB(); }
  }catch(e){ console.warn('数据损坏，已重置', e); DB = seed(); saveDB(); }
  fetchRemoteData();
}
/* GitHub 数据源：部署后从 data/games.json 拉取最新史低数据；本地/离线静默回退 */
function fetchRemoteData(force){
  if(!force && window.__remoteFetched) return; window.__remoteFetched = true;
  if(!window.fetch || location.protocol==='file:') return;
  fetch('data/games.json', {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(j=>mergeRemote(j))
    .catch(()=>{});
  fetch('data/deals.json', {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(j=>{ DB.deals = j; saveDB(); toast('已更新每周折扣（'+(j.meta&&j.meta.count||0)+' 条）'); route(); })
    .catch(()=>{});
}
function mergeRemote(remote){
  if(!remote || !Array.isArray(remote.games) || !remote.games.length) return;
  const localIdeas = DB.ideas || [];
  const localWatch = {};
  (DB.games||[]).forEach(g=>{ if(g.watch) localWatch[g.id] = g.watch; });
  const localComments = {};
  (DB.games||[]).forEach(g=>{ if(g.comments && g.comments.length) localComments[g.id] = g.comments; });
  remote.games.forEach(rg=>{
    if(localWatch[rg.id]) rg.watch = localWatch[rg.id];
    if(localComments[rg.id] && localComments[rg.id].length) rg.comments = localComments[rg.id];
    if(!rg.demo) rg.demo = demoFor(rg);
  });
  const oldIdeas = DB.ideas || [];
  DB = remote;
  DB.ideas = oldIdeas.length ? oldIdeas : localIdeas;
  saveDB();
  toast('已同步远程史低数据（'+(remote.meta&&remote.meta.dataDate||'最新')+'），本地蹲守/口碑/选题已保留');
  route();
}
function saveDB(){ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }

function demoFor(g){
  const kw = encodeURIComponent((g.name||g.en||'')+' Switch 试玩');
  return { img:'assets/'+g.id+'.jpg',
    url:'https://search.bilibili.com/all?keyword='+kw,
    label:'试玩视频' };
}
function regionOf(g, key){ return g.regions[key] || null; }
/* 折扣规律：某区打折记录的平均间隔（天） */
function saleGap(g, regionKey){
  const hs = g.history.filter(h=>h.r===regionKey && (h.t==='sale'||h.t==='low')).sort((a,b)=>a.d<b.d?-1:1);
  if(hs.length<2) return null;
  let sum=0;
  for(let i=1;i<hs.length;i++) sum += daysDiff(hs[i].d, hs[i-1].d);
  return Math.round(sum/(hs.length-1));
}
/* 有效现价（人民币口径）：cur 为折算价，或 nativeCur 按汇率折算 */
function curCNY(g, regionKey){
  const r = regionOf(g, regionKey);
  if(!r || r.tbd || r.cur==null) return null;
  return r.cur;
}
/* 蹲折扣状态 */
function watchState(g){
  const w=g.watch;
  if(!w.on) return null;
  const r = regionOf(g, w.region);
  const cur = curCNY(g, w.region);
  if(cur==null) return {hit:false, near:false, cur:null, target:w.target};
  const hit = cur <= w.target;
  return {hit, near: !hit && cur <= w.target*1.2, cur, target:w.target};
}
function isLowNow(g, key){
  const r=regionOf(g,key);
  if(!r||r.tbd||r.cur==null) return false;
  return r.low!=null && r.cur <= r.low;
}
function lastLowRecords(n){
  const out=[];
  DB.games.forEach(g=>{
    g.history.filter(h=>h.t==='low').forEach(h=>{
      const r=regionOf(g,h.r);
      if(r && r.cur!=null && h.p!=null) out.push({g, h});
    });
  });
  return out.sort((a,b)=>a.h.d<b.h.d?1:-1).slice(0,n);
}

function renderLibrary(){

function renderDetailChart(id){
  const el = $('#chart-price');
  if(!el) return;
  if(window.chartInst){ window.chartInst.dispose(); window.chartInst=null; }
  if(typeof echarts==='undefined'){ el.innerHTML='<div class="empty">图表库加载失败，请联网后刷新（ECharts CDN）</div>'; return; }
  const g=getGame(id);
  const series=[];
  REGIONS.forEach(rm=>{
    const pts=g.history.filter(h=>h.r===rm.key && h.p!=null).sort((a,b)=>a.d<b.d?-1:1);
    if(!pts.length) return;
    series.push({name:rm.label, type:'line', connectNulls:true, smooth:true, symbolSize:7,
      data:pts.map(h=>[h.d,h.p]),
      markPoint:{data:[{type:'min', name:'史低'}], label:{color:'#F5A623', fontSize:11}}});
  });
  if(!series.length){ el.innerHTML='<div class="empty">暂无价格记录，登记价格后生成趋势图</div>'; return; }
  const chart=echarts.init(el);
  chart.setOption({backgroundColor:'transparent', tooltip:{trigger:'axis', backgroundColor:'#182338', borderColor:'#2E3D5E', textStyle:{color:'#E6EDF7'}},
    legend:{textStyle:{color:'#8A9BB8'}, top:0},
    grid:{left:46, right:16, top:34, bottom:30},
    xAxis:{type:'time', axisLine:{lineStyle:{color:'#2E3D5E'}}, axisLabel:{color:'#8A9BB8'}},
    yAxis:{type:'value', name:'¥', nameTextStyle:{color:'#8A9BB8'}, axisLabel:{color:'#8A9BB8'}, splitLine:{lineStyle:{color:'rgba(46,61,94,.5)'}}},
    series});
  window.chartInst=chart;
}

function watchGuide(){
  const list = DB.games.filter(g=>g.watch.on);
  if(!list.length) return '还没有蹲守的游戏。先去游戏库给心仪的游戏设置目标价吧。';
  return list.map(g=>{
    const s = watchState(g);
    const rm = REGIONS.find(r=>r.key===g.watch.region);
    const r = regionOf(g, g.watch.region);
    const gap = saleGap(g, g.watch.region);
    const lowTxt = r && r.low!=null ? '史低 ¥'+r.low+'（'+r.lowDate+'）' : '暂无史低记录';
    const pattern = gap ? '平均约 '+gap+' 天一次促销' : '促销样本不足';
    const action = s.cur==null ? '待补录价格' : (s.hit ? '已到目标价，可以入手' : '建议蹲到 ¥'+s.target+' 再出手');
    return '《'+g.name+'》：'+rm.label+' 现价 ¥'+(s.cur!=null?s.cur:'—')+'，'+lowTxt+'，'+pattern+'。'+(s.cur!=null?'你的目标价 ¥'+s.target+' → '+action+'。':'')+g.rating.verdict;
  }).join('\n\n');
}
function regionCompareText(g){
  if(!g) return '请先在上方选择一款游戏。';
  const rows = Object.keys(g.regions).map(k=>{
    const r = g.regions[k]; const rm = REGIONS.find(x=>x.key===k);
    let cur = (r.tbd||r.cur==null)?'待补录':'¥'+r.cur+(r.nativeCur!=null&&r.currency!=='CNY'?'（'+r.nativeCur+r.currency+'）':'');
    let low = r.low!=null?'¥'+r.low+(r.lowDate?'（'+r.lowDate+'）':''):'—';
    return '| '+rm.label+' | '+cur+' | '+low+' | '+(g.zh?'是':'否')+' |';
  }).join('\n');
  return '《'+g.name+'》换区价格对比\n\n| 区域 | 现价 | 历史最低 | 中文 |\n|---|---|---|---|\n'+rows+'\n\n换区提示：换区前余额会清零，建议先花完或用完余额再切区；点卡选靠谱渠道，日区/港区点卡最稳，巴西区注意汇率波动与锁区风险。';
}

function importData(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.games||!d.meta) throw new Error('bad');
      DB=d; saveDB(); toast('导入成功'); route();
    }catch(e){ toast('导入失败：文件格式不正确','err'); }
  };
  rd.readAsText(f);
}

function checkInSubmit(){
  const g=getGame($('#ci-id').value);
  const k=$('#ci-region').value;
  const r=g.regions[k] || (g.regions[k]={});
  let cur;
  if($('#ci-native').checked){
    const nv=parseFloat($('#ci-native-v').value);
    const cv=$('#ci-currency').value;
    if(!(nv>0)){ toast('请输入有效的原币价','err'); return; }
    cur=Math.round(nv*DB.meta.rates[cv]*10)/10;
    r.nativeCur=nv; r.currency=cv;
  }else{
    cur=parseFloat($('#ci-cny').value);
    if(!(cur>0)){ toast('请输入有效的价格','err'); return; }
    r.nativeCur=null; r.currency=null;
  }
  const end=$('#ci-end').value||null;
  const note=$('#ci-note').value.trim()||(end?('登记 ¥'+cur):'登记 ¥'+cur);
  const isLow = r.low==null || cur < r.low;
  r.cur=cur; r.tbd=false; r.onSale=!!end; r.saleEnd=end;
  if(isLow){ r.low=cur; r.lowDate=today(); }
  g.history.push({d:today(), r:k, p:cur, t:isLow?'low':'sale', note});
  saveDB(); closeModal();
  const s=watchState(g);
  const rl = REGIONS.find(x=>x.key===k).label;
  if(s&&s.hit) toast('《'+g.name+'》'+rl+' ¥'+cur+' 已达目标价 ¥'+s.target+'，可以入手！','warn');
  else if(isLow) toast('新史低：《'+g.name+'》'+rl+' ¥'+cur);
  else toast('已登记《'+g.name+'》'+rl+' ¥'+cur);
  route();
}

    pcNote:$('#eg-pc').value.trim(),
    video:{title:$('#eg-vtitle').value.trim(), url:$('#eg-vurl').value.trim()},
    demo:{img:$('#eg-dimg').value.trim(), url:$('#eg-durl').value.trim(), label:$('#eg-dlabel').value.trim()||'打开试玩 / Demo 信息'},
    comments:$('#eg-comments').value.split('\n').map(s=>s.trim()).filter(Boolean).map(c=>({c:c, src:'评论区', d:today()}))
  };
  if(id){ Object.assign(g, patch); }
  else{
    DB.games.push(Object.assign({id:'g'+Date.now().toString(36), zh:true, regions:{}, history:[], lowInfo:'', watch:{on:false,target:0,region:'hk'}}, patch));
  }
  saveDB(); closeModal(); toast('已保存《'+name+'》'); route();
}
function addGameModal(){ editGameModal(null); }
/* ============ 初始化 ============ */
loadDB();
window.addEventListener('hashchange', route);
route();
</script>
